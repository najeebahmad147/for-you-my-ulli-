<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For My Ulli 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0007;--pink:#ff4fa3;--red:#e0143c;--purple:#8b2fe0;--yellow:#ffd84a;--card:rgba(20,6,30,.78);--text:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0a0007;color:#fff;font-family:'Poppins',system-ui,sans-serif}
body{background:radial-gradient(circle at 20% 15%,#4a0a6b 0,transparent 45%),radial-gradient(circle at 85% 85%,#7a0a2c 0,transparent 45%),#0a0007}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:2}
.screen.on{display:flex;animation:in .7s ease}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.petal{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.box{background:var(--card);border:2px solid var(--yellow);border-radius:26px;padding:28px 22px;width:min(92vw,420px);box-shadow:0 0 30px var(--purple),0 0 60px rgba(255,79,163,.35);backdrop-filter:blur(6px)}
.tap{font-family:'Pacifico',cursive;font-size:clamp(26px,7vw,40px);cursor:pointer;border:3px solid var(--yellow);padding:30px 24px;border-radius:30px;width:min(92vw,430px);background:linear-gradient(135deg,rgba(139,47,224,.55),rgba(224,20,60,.5));box-shadow:0 0 25px var(--pink),0 0 70px var(--purple);animation:pulse 1.6s infinite;line-height:1.5;color:#fff;text-shadow:0 0 12px var(--yellow)}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 40px var(--yellow),0 0 90px var(--pink)}}
.deco{font-size:34px;letter-spacing:6px;margin:6px 0}
h2{font-family:'Pacifico',cursive;color:var(--yellow);font-size:28px;margin-bottom:6px;font-weight:400}
label{display:block;text-align:left;margin:16px 0 6px;color:var(--pink);font-weight:700;font-size:14px;letter-spacing:1px}
input{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--purple);background:#14061c;color:#fff;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--pink)}
.msg{font-size:13px;margin-top:6px;text-align:left;min-height:18px;font-weight:700}
.err{color:#ff5470}.ok{color:#5dffa0}
input.bad{border-color:#ff5470;animation:shake .35s}
input.good{border-color:#5dffa0}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:inherit;font-weight:700;font-size:20px;padding:14px 38px;border:none;border-radius:40px;cursor:pointer;color:#fff;letter-spacing:2px;background:linear-gradient(135deg,var(--red),var(--pink));box-shadow:0 0 20px var(--pink);transition:transform .15s}
.btn:active{transform:scale(.93)}
.btn.yes{background:linear-gradient(135deg,#1fb86a,var(--yellow));color:#1a0020;font-size:24px;padding:16px 48px}
.btn.no{background:#222;border:2px solid var(--purple);box-shadow:0 0 14px var(--purple);z-index:5}
.big{font-family:'Pacifico',cursive;font-size:clamp(34px,10vw,56px);color:var(--yellow);text-shadow:0 0 18px var(--red),0 0 40px var(--purple);margin:10px 0;font-weight:400}
.q{font-size:clamp(20px,5.6vw,30px);font-weight:700;margin:14px 0 30px;color:var(--pink);text-shadow:0 0 12px var(--purple)}
.row{display:flex;gap:26px;justify-content:center;align-items:center;min-height:70px}
canvas{position:fixed;inset:0;z-index:3;pointer-events:none}
#thanks{font-size:clamp(34px,10vw,64px);z-index:4}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="screen on" id="s1">
  <div class="deco">🌹🪷🌹</div>
  <div class="tap" id="tapbox">TAP HERE MY ULLIII 💜</div>
  <div class="deco">🌸🌹🪷🌹🌸</div>
</div>

<div class="screen" id="s2">
  <div class="box">
    <div class="deco">🌹🪷🌹</div>
    <h2>Verify Karo Ulli 💛</h2>
    <label>DATE OF BIRTH</label>
    <input type="date" id="dob">
    <div class="msg" id="m1"></div>
    <label>CLASS</label>
    <input type="text" id="cls" placeholder="e.g. 9th class" autocomplete="off">
    <div class="msg" id="m2"></div>
  </div>
</div>

<div class="screen" id="s3">
  <div class="box" style="border-color:var(--pink)">
    <div class="deco">🌹🪷🌹🪷🌹</div>
    <div class="big" style="font-size:34px">Perfect Ulli! ✨</div>
    <div class="deco">🌸🌹🪷🌹🌸</div>
    <br><button class="btn" id="next">NEXT 💕</button><br><br>
    <div class="deco">🪷🌹🪷🌹🪷</div>
  </div>
</div>

<div class="screen" id="s4">
  <div class="deco">🌹🪷🌹🪷🌹</div>
  <div class="big">WASSUP ULLI 💜</div>
  <div class="q">WOULD YOU LIKE TO BE MY ULLI???</div>
  <div class="row" id="row">
    <button class="btn yes" id="yes">YES 💖</button>
    <button class="btn no" id="no">NO</button>
  </div>
  <div class="deco" style="margin-top:24px">🪷🌹🪷🌹🪷</div>
</div>

<div class="screen" id="s5">
  <div class="big" id="thanks">THANK YOU KIDDOOO!!!! 💖</div>
  <div class="deco">🌹🪷🌹🪷🌹</div>
</div>

<script>
const $=id=>document.getElementById(id);
function show(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on')}

// falling petals
const em=['🌹','🪷','🌸','💜','💛','❤️','🌷'];
for(let i=0;i<22;i++){const p=document.createElement('div');p.className='petal';p.textContent=em[i%em.length];
p.style.left=Math.random()*100+'vw';p.style.fontSize=(16+Math.random()*20)+'px';
p.style.animationDuration=(7+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*12)+'s';p.style.opacity=.75;document.body.appendChild(p)}

$('tapbox').onclick=()=>show(2);

let dobOk=false,clsOk=false;
function check(){
  const d=$('dob').value, c=$('cls').value.toLowerCase().replace(/\s+/g,' ').trim();
  dobOk=d==='2010-03-16';
  clsOk=/^(class )?10(th)?( class)?$/.test(c);
  upd('dob','m1',dobOk,d,'Galat date hai Ulli, phir se try karo 🥺');
  upd('cls','m2',clsOk,c,'Galat class hai Ulli, phir se try karo 🥺');
  if(dobOk&&clsOk)setTimeout(()=>show(3),900);
}
function upd(i,m,ok,val,e){
  const inp=$(i),msg=$(m);
  inp.classList.toggle('good',ok);
  if(ok){inp.classList.remove('bad');msg.className='msg ok';msg.textContent='Correct! ✅'}
  else if(val){inp.classList.add('bad');msg.className='msg err';msg.textContent='ERROR: '+e;setTimeout(()=>inp.classList.remove('bad'),400)}
  else{msg.textContent=''}
}
$('dob').addEventListener('input',check);$('dob').addEventListener('change',check);
$('cls').addEventListener('input',check);

$('next').onclick=()=>show(4);

// NO button runs away on every tap
const no=$('no');
function dodge(e){
  e.preventDefault();
  no.style.position='fixed';
  const w=no.offsetWidth,h=no.offsetHeight;
  no.style.left=Math.random()*(innerWidth-w-20)+10+'px';
  no.style.top=Math.random()*(innerHeight-h-20)+10+'px';
}
no.addEventListener('click',dodge);
no.addEventListener('touchstart',dodge,{passive:false});

// fireworks
const cv=$('fx'),cx=cv.getContext('2d');let P=[],go=false;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
const cols=['#ff4fa3','#ffd84a','#8b2fe0','#e0143c','#ffffff','#b46bff'];
function burst(x,y){const c=cols[Math.random()*cols.length|0];
  for(let i=0;i<70;i++){const a=Math.random()*6.283,s=1+Math.random()*5;
  P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}
function loop(){
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,cv.width,cv.height);
  cx.globalCompositeOperation='lighter';
  P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.99;p.l-=.013;
    cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.5,0,6.283);cx.fill()});
  cx.globalAlpha=1;requestAnimationFrame(loop)}
$('yes').onclick=()=>{
  show(5);if(go)return;go=true;loop();
  const f=()=>burst(Math.random()*cv.width,Math.random()*cv.height*.75);
  for(let i=0;i<6;i++)setTimeout(f,i*180);
  setInterval(f,450);setInterval(f,700);
};
</script>
</body>
</html>
